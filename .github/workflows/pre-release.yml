name: Build Windows pre-release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install project build dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MinGW audio build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            diffutils
            make

      - name: Build the project FFmpeg
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh

      - name: Build the Windows installer
        run: npm run package:windows

      - name: Publish this commit as a pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pre-${{ github.run_number }}-${{ github.sha }}
          name: Pre-release ${{ github.sha }}
          body: |
            Automated Windows installer for commit `${{ github.sha }}`.

            This is a pre-release build generated for each pushed commit.
          prerelease: true
          make_latest: false
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
